spring.application.name=shop_spring

spring.datasource.url=jdbc:postgresql://localhost:5432/shop_spring

spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ===== ????????? KAFKA =====
# ????? Kafka ???????
spring.kafka.bootstrap-servers=localhost:9092
implementation 'org.springframework.kafka:spring-kafka'

# ????????? Producer (???????????)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# ???????????? ?????? ????????? (???? ?????? ???????)
spring.kafka.producer.properties.max.request.size=10485760

# ????????? Consumer (??????????)
spring.kafka.consumer.group-id=shop-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=\
    user-created-event:com.example.shop_spring.domain.events.user.UserCreatedEvent,\
    user-updated-event:com.example.shop_spring.domain.events.user.UserUpdatedEvent,\
    user-deleted-event:com.example.shop_spring.domain.events.user.UserDeletedEvent
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false  # ????????? ????-??????

# ????????? Listener (??????????)
spring.kafka.listener.ack-mode=manual  # ?????? ?????????????
spring.kafka.listener.concurrency=3    # ?????????? ??????? (== ????? ????????)

# ===== ????????? ????????? ??? ?????????? =====
# ???????? ??????? (????? ?? ?????????? ? ????)
app.kafka.topics.user-events=user-events
app.kafka.topics.user-events-dlq=user-events-dlq
app.kafka.consumer.group-id=shop-service-group

# ===== ??????????? =====
logging.level.org.springframework.kafka=INFO
logging.level.com.example.shop_spring.infrastructure=DEBUG